<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warung Barokah Madiun</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>

    <!-- Bagian Atas: Banner & Logo Profil -->
    <div class="banner">
        <div class="profile-container">
            <!-- Ganti URL gambar di bawah dengan foto logomu sendiri -->
            <!-- Setelah diubah: -->
            <img src="icon-profil.png" alt="Logo Warung" class="logo-bulat">
            <h1 class="title">WARUNG BAROKAH MADIUN</h1>
        </div>
    </div>

    <!-- INI DIV PENUTUP / PEMBATAS YANG DITAMBAHKAN -->
    <div class="pembatas-banner"></div>

    <!-- Bagian Slogan -->
    <p class="slogan">“Nikmat, Hangat, Mengenyangkan”</p>

    <!-- Bagian Menu Utama -->
    <div class="menu-container" id="menu-list">
        <!-- Menu akan otomatis muncul di sini via JavaScript -->
    </div>

    <!-- Bagian Pemesanan & Lokasi -->
    <div class="order-section">
        <h3>Bagian Pemesanan</h3>
        <!-- Ganti nomor WA & teks sesuai kebutuhan -->
        <a href="https://wa.me" target="_blank" class="btn btn-wa">
            💬 Hubungi WhatsApp
        </a>
        <!-- Ganti link Google Maps sesuai lokasi warungmu -->
        <a href="https://google.com" target="_blank" class="btn btn-maps">
            📍 Alamat Warung (Google Maps)
        </a>
    </div>

        <!-- Firebase SDK (Modular v10) untuk Halaman Utama -->
      <script type="module">
    // Registrasi Service Worker untuk PWA
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
    }

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    alert('1. Import berhasil!');

    const firebaseConfig = {
        apiKey: "AIzaSyAtGr7IooU8wgYYL8yUxTvzlwoo8hULAtM",
        authDomain: "warung-barokah-madiun.firebaseapp.com",
        databaseURL: "https://warung-barokah-madiun-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "warung-barokah-madiun",
        storageBucket: "warung-barokah-madiun.firebasestorage.app",
        messagingSenderId: "426247388838",
        appId: "1:426247388838:web:e8f1da4af0f09ccf2a7e67"
    };

    alert('2. Config terbaca!');

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const menuRef = ref(db, 'menu');

    alert('3. Firebase siap!');

    onValue(menuRef, (snapshot) => {
        alert('4. Data diterima!');
        const menuList = document.getElementById('menu-list');
        const data = snapshot.val();
        
        if (!data) {
            menuList.innerHTML = '<p style="text-align:center; grid-column: 1/-1; color:#999;">Belum ada menu. Tambahkan lewat halaman admin.</p>';
            return;
        }

        let menuHTML = '';
        for (let id in data) {
            const item = data[id];
            menuHTML += `
                <div class="menu-card">
                    <img src="${item.foto}" alt="${item.judul}">
                    <div class="menu-info">
                        <div class="menu-title">${item.judul}</div>
                        <div class="menu-price">Rp ${parseInt(item.harga).toLocaleString('id-ID')}</div>
                    </div>
                </div>
            `;
        }
        menuList.innerHTML = menuHTML;
    }, (error) => {
        alert('ERROR: ' + error.message);
    });
      </script>
    </body>
</html>
