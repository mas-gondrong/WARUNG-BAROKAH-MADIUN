<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Warung Barokah</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-list-container { max-width: 500px; margin: 20px auto; padding: 20px; background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .admin-item { display: flex; align-items: center; justify-content: space-between; padding: 10px; border-bottom: 1px solid #eee; gap: 10px; }
        .admin-item img { width: 50px; height: 50px; object-fit: cover; border-radius: 6px; }
        .admin-item-info { flex-grow: 1; }
        .admin-item-title { font-weight: bold; font-size: 0.95rem; }
        .admin-item-price { color: #e67e22; font-size: 0.85rem; }
        .admin-actions { display: flex; gap: 5px; }
        .btn-action { padding: 6px 10px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.8rem; color: white; }
        .btn-edit { background-color: #f1c40f; }
        .btn-delete { background-color: #e74c3c; }
        .preview-img { width: 100%; height: 150px; object-fit: cover; border-radius: 6px; display: none; margin-top: 10px; border: 1px dashed #ccc; }
    </style>

    <!-- Menggunakan Firebase v8 SDK yang jauh lebih bersahabat dan anti-crash di web statis -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
</head>
<body>
    <!-- LAYAR LOGIN RAHASIA -->
<div id="login-overlay">
    <form id="login-form">
        <h3>🔒 Admin Warung Barokah</h3>
        <input type="email" id="login-email" placeholder="Email" autocomplete="email" required>
        <input type="password" id="login-password" placeholder="Password" autocomplete="current-password" required>
        <button type="submit">Masuk</button>
        <p id="login-info" style="text-align:center; font-size:0.8rem; margin-top:10px; color:#999;">
            Halaman khusus Admin
        </p>
    </form>
</div>

<!-- SEMUA KONTEN ADMIN (tersembunyi sampai login sukses) -->
<div id="admin-content" style="display:none;">

    <div class="admin-container">
        <h2 id="form-title">Tambah Menu Baru</h2>
        
        <form id="menu-form">
            <input type="hidden" id="menu-id">
            
            <div class="form-group">
                <label>Pilih Foto Makanan (dari Galeri)</label>
                <input type="file" id="menu-foto-file" accept="image/*">
                <input type="hidden" id="menu-foto-base64">
                <img id="image-preview" class="preview-img" alt="Pratinjau Gambar">
            </div>
            <div class="form-group">
                <label>Nama/Judul Menu</label>
                <input type="text" id="menu-judul" placeholder="Soto Ayam" required>
            </div>
            <div class="form-group">
                <label>Harga (Rupiah)</label>
                <input type="number" id="menu-harga" placeholder="15000" required>
            </div>
            <button type="submit" id="btn-submit-text" class="btn-submit">Simpan Menu ke Cloud</button>
            <button type="button" id="btn-batal-edit" class="btn-submit" style="background-color:#7f8c8d; margin-top:5px; display:none;">Batal Edit</button>
        </form>

        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
        
        <a href="index.html" style="display:block; text-align:center; color:#2c3e50; text-decoration:none; font-weight:600;">
            ← Kembali ke Halaman Utama
            <button type="button" id="btn-logout" class="btn-submit" style="background-color:#e74c3c; margin-top:5px;">
    🚪 Keluar (Logout)
            </button>
        </a>
    </div>

    <div class="admin-list-container">
        <h3>Kelola Daftar Menu</h3>
        <div id="admin-menu-list" style="margin-top: 15px;">
            <p style="text-align: center; color: #999;">Memuat daftar menu...</p>
        </div>
    </div>

    <!-- ===== KELOLA TESTIMONI ===== -->
<div class="admin-list-container">
    <h3>Kelola Testimoni</h3>
    <form id="testimoni-form">
        <input type="hidden" id="testimoni-id">
        <div class="form-group">
            <label>Nama Pelanggan</label>
            <input type="text" id="testimoni-nama" placeholder="Pak Slamet - Kuli Bangunan" required>
        </div>
        <div class="form-group">
            <label>Komentar</label>
            <textarea id="testimoni-komentar" rows="3" placeholder="Soto ayamnya juara, bumbunya nempel di hati!" required></textarea>
        </div>
        <div class="form-group">
            <label>Bintang</label>
            <select id="testimoni-bintang">
                <option value="5">⭐⭐⭐⭐⭐ (5)</option>
                <option value="4">⭐⭐⭐⭐ (4)</option>
                <option value="3">⭐⭐⭐ (3)</option>
                <option value="2">⭐⭐ (2)</option>
                <option value="1">⭐ (1)</option>
            </select>
        </div>
        <button type="submit" id="btn-testimoni-submit" class="btn-submit">Simpan Testimoni</button>
        <button type="button" id="btn-testimoni-batal" class="btn-submit" style="background-color:#7f8c8d; margin-top:5px; display:none;">Batal Edit</button>
    </form>
    <div id="admin-testimoni-list" style="margin-top: 15px;">
        <p style="text-align:center; color:#999;">Memuat testimoni...</p>
    </div>
</div>

</div>

    <script>
        // Konfigurasi resmi proyek Warung Barokah Madiun dengan databaseURL terpasang
        const firebaseConfig = {
  apiKey: "AIzaSyAtGr7looU8wgYYL8yUxTvzlwoo8hULAtM",
  authDomain: "warung-barokah-madiun.firebaseapp.com",
  databaseURL: "https://warung-barokah-madiun-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "warung-barokah-madiun",
  storageBucket: "warung-barokah-madiun.firebasestorage.app",
  messagingSenderId: "426247388838",
  appId: "1:426247388838:web:e8f1da4af0f09ccf2a7e67"
};

        // Inisialisasi Firebase v8
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const menuRef = db.ref('menu');

        // ===== SISTEM LOGIN ADMIN =====
        const auth = firebase.auth();

       // Cek status login setiap kali halaman dibuka
auth.onAuthStateChanged(function(user) {
    if (user) {
        // Sudah login → tampilkan konten admin
        document.getElementById('login-overlay').style.display = 'none';
        document.getElementById('admin-content').style.display = 'block';
    } else {
        // Belum login → tampilkan layar login
        document.getElementById('login-overlay').style.display = 'flex';
        document.getElementById('admin-content').style.display = 'none';
    }
});

// Aksi tombol Masuk
document.getElementById('login-form').addEventListener('submit', function(e) {
    e.preventDefault();
    const email = document.getElementById('login-email').value;
    const pass = document.getElementById('login-password').value;
    auth.signInWithEmailAndPassword(email, pass)
        .catch(function(err) { alert('Login gagal: ' + err.message); });
});

// Aksi tombol Logout
document.getElementById('btn-logout').addEventListener('click', function() {
    if (confirm('Keluar dari Admin?')) auth.signOut();
});

        // ===== KELOLA TESTIMONI =====
const testimoniRef = db.ref('testimoni');
const formTestimoni = document.getElementById('testimoni-form');

testimoniRef.on('value', (snapshot) => {
    const list = document.getElementById('admin-testimoni-list');
    const data = snapshot.val();

    if (!data) {
        list.innerHTML = '<p style="text-align:center; color:#999;">Belum ada testimoni. Tambahkan lewat form di atas.</p>';
        return;
    }

    let html = '';
    for (let id in data) {
        const t = data[id];
        const bintang = '⭐'.repeat(parseInt(t.bintang) || 0);
        html += `
            <div class="admin-item">
                <div class="admin-item-info">
                    <div class="admin-item-title">${t.nama}</div>
                    <div style="font-size:0.8rem; color:#666;">${bintang}</div>
                </div>
                <div class="admin-actions">
                    <button type="button" class="btn-action btn-edit" onclick="aksiEditTestimoni('${id}')">Edit</button>
                    <button type="button" class="btn-action btn-delete" onclick="aksiHapusTestimoni('${id}')">Hapus</button>
                </div>
            </div>
        `;
    }
    list.innerHTML = html;
});

function resetTestimoniForm() {
    formTestimoni.reset();
    document.getElementById('testimoni-id').value = '';
    document.getElementById('btn-testimoni-submit').innerText = 'Simpan Testimoni';
    document.getElementById('btn-testimoni-batal').style.display = 'none';
}

window.aksiHapusTestimoni = function(id) {
    if (confirm('Hapus testimoni ini?')) {
        db.ref('testimoni/' + id).remove()
            .then(() => alert('Testimoni berhasil dihapus!'))
            .catch(err => alert('Gagal hapus: ' + err.message));
    }
};

window.aksiEditTestimoni = function(id) {
    testimoniRef.child(id).once('value', (s) => {
        const t = s.val();
        document.getElementById('testimoni-id').value = id;
        document.getElementById('testimoni-nama').value = t.nama;
        document.getElementById('testimoni-komentar').value = t.komentar;
        document.getElementById('testimoni-bintang').value = t.bintang;
        document.getElementById('btn-testimoni-submit').innerText = 'Simpan Perubahan';
        document.getElementById('btn-testimoni-batal').style.display = 'block';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    });
};

document.getElementById('btn-testimoni-batal').addEventListener('click', resetTestimoniForm);

formTestimoni.addEventListener('submit', function(e) {
    e.preventDefault();

    const id = document.getElementById('testimoni-id').value;
    const data = {
        nama: document.getElementById('testimoni-nama').value.trim(),
        komentar: document.getElementById('testimoni-komentar').value.trim(),
        bintang: document.getElementById('testimoni-bintang').value
    };

    if (id) {
        db.ref('testimoni/' + id).update(data)
            .then(() => { alert('Testimoni berhasil diperbarui!'); resetTestimoniForm(); })
            .catch(err => alert('Gagal update: ' + err.message));
        } else {
        testimoniRef.push({
            nama: data.nama,
            komentar: data.komentar,
            bintang: data.bintang,
            waktu: firebase.database.ServerValue.TIMESTAMP   // versi v8
        })
        .then(() => { alert('Testimoni baru berhasil disimpan!'); resetTestimoniForm(); })
        .catch(err => alert('Gagal menyimpan: ' + err.message));
    }

        const fileInput = document.getElementById('menu-foto-file');
        const base64Input = document.getElementById('menu-foto-base64');
        const imgPreview = document.getElementById('image-preview');

        // Mengubah foto galeri menjadi string teks base64
        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    base64Input.value = event.target.result;
                    imgPreview.src = event.target.result;
                    imgPreview.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        });

        // Menampilkan data menu secara otomatis & Real-time
        menuRef.on('value', (snapshot) => {
            const listContainer = document.getElementById('admin-menu-list');
            const data = snapshot.val();
            
            if (!data) {
                listContainer.innerHTML = '<p style="text-align:center; color:#999;">Belum ada menu di database.</p>';
                return;
            }

            let listHTML = '';
            for (let id in data) {
                const item = data[id];
                listHTML += `
                    <div class="admin-item">
                        <img src="${item.foto}" alt="${item.judul}">
                        <div class="admin-item-info">
                            <div class="admin-item-title">${item.judul}</div>
                            <div class="admin-item-price">Rp ${parseInt(item.harga).toLocaleString('id-ID')}</div>
                        </div>
                        <div class="admin-actions">
                            <button type="button" class="btn-action btn-edit" onclick="aksiEdit('${id}', '${item.judul}', '${item.harga}', '${item.foto}')">Edit</button>
                            <button type="button" class="btn-action btn-delete" onclick="aksiHapus('${id}')">Hapus</button>
                        </div>
                    </div>
                `;
            }
            listContainer.innerHTML = listHTML;
        }, (error) => {
            document.getElementById('admin-menu-list').innerHTML = `<p style="text-align:center; color:red;">Terjadi kesalahan: ${error.message}</p>`;
        });

        // Fungsi Hapus Menu
        window.aksiHapus = function(id) {
            if(confirm('Apakah Anda yakin ingin menghapus menu ini?')) {
                db.ref('menu/' + id).remove()
                .then(() => alert('Menu berhasil dihapus!'))
                .catch(err => alert('Gagal hapus: ' + err.message));
            }
        }

        // Fungsi Edit Menu
        window.aksiEdit = function(id, judul, harga, foto) {
            document.getElementById('menu-id').value = id;
            document.getElementById('menu-judul').value = judul;
            document.getElementById('menu-harga').value = harga;
            base64Input.value = foto;
            
            imgPreview.src = foto;
            imgPreview.style.display = 'block';

            document.getElementById('form-title').innerText = "Edit Menu Makanan";
            document.getElementById('btn-submit-text').innerText = "Simpan Perubahan";
            document.getElementById('btn-batal-edit').style.display = "block";
        }

        // Fungsi Batal Edit
        document.getElementById('btn-batal-edit').addEventListener('click', resetFormAdmin);

        function resetFormAdmin() {
            document.getElementById('menu-form').reset();
            document.getElementById('menu-id').value = "";
            base64Input.value = "";
            imgPreview.style.display = 'none';
            document.getElementById('form-title').innerText = "Tambah Menu Baru";
            document.getElementById('btn-submit-text').innerText = "Simpan Menu ke Cloud";
            document.getElementById('btn-batal-edit').style.display = "none";
        }

        // Aksi Submit Form (Simpan / Update)
        document.getElementById('menu-form').addEventListener('submit', function(e) {
            e.preventDefault();

            const menuId = document.getElementById('menu-id').value;
            const foto = base64Input.value;
            const judul = document.getElementById('menu-judul').value;
            const harga = document.getElementById('menu-harga').value;

            if (!foto) {
                alert('Silakan pilih foto makanan terlebih dahulu dari galeri!');
                return;
            }

            if (menuId) {
                // Jalankan Proses update
                db.ref('menu/' + menuId).update({ foto, judul, harga })
                .then(() => {
                    alert('Menu berhasil diperbarui!');
                    resetFormAdmin();
                }).catch(err => alert('Gagal update: ' + err.message));
            } else {
                // Jalankan Proses tambah baru
                menuRef.push({ foto, judul, harga })
                .then(() => {
                    alert('Menu baru berhasil disimpan ke Firebase!');
                    resetFormAdmin();
                }).catch(err => alert('Gagal menyimpan: ' + err.message));
            }
        });
    </script>
</body>
</html>
