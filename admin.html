<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Warung Barokah</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="admin-container">
        <h2>Tambah Menu Baru</h2>
        <p style="font-size:0.85rem; color:#7f8c8d; margin-bottom:20px;">Data disimpan langsung di browser ini.</p>
        
        <form id="menu-form">
            <div class="form-group">
                <label>URL Foto Makanan</label>
                <input type="url" id="menu-foto" placeholder="https://link-foto.com" required>
            </div>
            <div class="form-group">
                <label>Nama/Judul Menu</label>
                <input type="text" id="menu-judul" placeholder="Nasi Goreng Spesial" required>
            </div>
            <div class="form-group">
                <label>Harga (Rupiah)</label>
                <input type="number" id="menu-harga" placeholder="15000" required>
            </div>
            <button type="submit" class="btn-submit">Simpan Menu</button>
        </form>

        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
        
        <a href="index.html" style="display:block; text-align:center; color:#2c3e50; text-decoration:none; font-weight:600;">
            ← Kembali ke Halaman Utama
        </a>
    </div>

    <script>
        document.getElementById('menu-form').addEventListener('submit', function(e) {
            e.preventDefault();

            const foto = document.getElementById('menu-foto').value;
            const judul = document.getElementById('menu-judul').value;
            const harga = document.getElementById('menu-harga').value;

            // Ambil data lama
            const currentMenu = JSON.parse(localStorage.getItem('warung_menu')) || [];

            // Tambah data baru
            currentMenu.push({ foto, judul, harga });

            // Simpan kembali ke LocalStorage
            localStorage.setItem('warung_menu', JSON.stringify(currentMenu));

            alert('Menu berhasil ditambahkan!');
            
            // Reset Form
            document.getElementById('menu-form').reset();
        });
    </script>
</body>
</html>
