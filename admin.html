<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Warung Barokah</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="admin-container">
        <h2>Tambah Menu Baru (Firebase)</h2>
        
        <form id="menu-form">
            <div class="form-group">
                <label>URL Foto Makanan</label>
                <input type="url" id="menu-foto" placeholder="https://link-foto.com" required>
            </div>
            <div class="form-group">
                <label>Nama/Judul Menu</label>
                <input type="text" id="menu-judul" placeholder="Nasi Goreng Spesial" required>
            </div>
            <div class="form-group">
                <label>Harga (Rupiah)</label>
                <input type="number" id="menu-harga" placeholder="15000" required>
            </div>
            <button type="submit" class="btn-submit">Simpan Menu ke Cloud</button>
        </form>

        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
        
        <a href="index.html" style="display:block; text-align:center; color:#2c3e50; text-decoration:none; font-weight:600;">
            ← Kembali ke Halaman Utama
        </a>
    </div>

    <!-- Firebase SDK (Modular v10) -->
    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getDatabase, ref, push } from "https://gstatic.com";

        // Konfigurasi Firebase kamu
        const firebaseConfig = {
  apiKey: "AIzaSyAtGr7looU8wgYYL8yUxTvzlwoo8hULAtM",
  authDomain: "warung-barokah-madiun.firebaseapp.com",
  projectId: "warung-barokah-madiun",
  storageBucket: "warung-barokah-madiun.firebasestorage.app",
  messagingSenderId: "426247388838",
  appId: "1:426247388838:web:e8f1da4af0f09ccf2a7e67"
};

        // Inisialisasi Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Aksi ketika tombol Simpan ditekan
        document.getElementById('menu-form').addEventListener('submit', function(e) {
            e.preventDefault();

            const foto = document.getElementById('menu-foto').value;
            const judul = document.getElementById('menu-judul').value;
            const harga = document.getElementById('menu-harga').value;

            // Referensi ke node 'menu' di Firebase
            const menuRef = ref(db, 'menu');

            // Kirim data ke Firebase
            push(menuRef, {
                foto: foto,
                judul: judul,
                harga: harga
            })
            .then(() => {
                alert('Menu berhasil disimpan ke Firebase!');
                document.getElementById('menu-form').reset();
            })
            .catch((error) => {
                alert('Gagal menyimpan data: ' + error.message);
            });
        });
    </script>
</body>
</html>
