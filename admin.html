<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Warung Barokah</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-list-container { max-width: 500px; margin: 20px auto; padding: 20px; background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .admin-item { display: flex; align-items: center; justify-content: space-between; padding: 10px; border-bottom: 1px solid #eee; gap: 10px; }
        .admin-item img { width: 50px; height: 50px; object-fit: cover; border-radius: 6px; }
        .admin-item-info { flex-grow: 1; }
        .admin-item-title { font-weight: bold; font-size: 0.95rem; }
        .admin-item-price { color: #e67e22; font-size: 0.85rem; }
        .admin-actions { display: flex; gap: 5px; }
        .btn-action { padding: 6px 10px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.8rem; color: white; }
        .btn-edit { background-color: #f1c40f; }
        .btn-delete { background-color: #e74c3c; }
        .preview-img { width: 100%; height: 150px; object-fit: cover; border-radius: 6px; display: none; margin-top: 10px; border: 1px dashed #ccc; }
    </style>

    <!-- Memanggil Firebase SDK Versi Ambil Mudah (Compat) -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
</head>
<body>

    <div class="admin-container">
        <h2 id="form-title">Tambah Menu Baru</h2>
        
        <form id="menu-form">
            <input type="hidden" id="menu-id">
            
            <div class="form-group">
                <label>Pilih Foto Makanan (dari Galeri)</label>
                <input type="file" id="menu-foto-file" accept="image/*">
                <input type="hidden" id="menu-foto-base64">
                <img id="image-preview" class="preview-img" alt="Pratinjau Gambar">
            </div>
            <div class="form-group">
                <label>Nama/Judul Menu</label>
                <input type="text" id="menu-judul" placeholder="Soto Ayam" required>
            </div>
            <div class="form-group">
                <label>Harga (Rupiah)</label>
                <input type="number" id="menu-harga" placeholder="15000" required>
            </div>
            <button type="submit" id="btn-submit-text" class="btn-submit">Simpan Menu ke Cloud</button>
            <button type="button" id="btn-batal-edit" class="btn-submit" style="background-color:#7f8c8d; margin-top:5px; display:none;">Batal Edit</button>
        </form>

        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
        
        <a href="index.html" style="display:block; text-align:center; color:#2c3e50; text-decoration:none; font-weight:600;">
            ← Kembali ke Halaman Utama
        </a>
    </div>

    <div class="admin-list-container">
        <h3>Kelola Daftar Menu</h3>
        <div id="admin-menu-list" style="margin-top: 15px;">
            <p style="text-align: center; color: #999;">Memuat daftar menu...</p>
        </div>
    </div>

    <script>
        // ⚠️ GANTI DENGAN DATA FIREBASE ASLI MILIKMU
        const firebaseConfig = {
  apiKey: "AIzaSyAtGr7looU8wgYYL8yUxTvzlwoo8hULAtM",
  authDomain: "warung-barokah-madiun.firebaseapp.com",
  projectId: "warung-barokah-madiun",
  storageBucket: "warung-barokah-madiun.firebasestorage.app",
  messagingSenderId: "426247388838",
  appId: "1:426247388838:web:e8f1da4af0f09ccf2a7e67"
};

        // Inisialisasi Firebase cara lama yang jauh lebih stabil di PWA
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const menuRef = db.ref('menu');

        const fileInput = document.getElementById('menu-foto-file');
        const base64Input = document.getElementById('menu-foto-base64');
        const imgPreview = document.getElementById('image-preview');

        // Fungsi merubah Gambar Galeri ke teks Base64
        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    base64Input.value = event.target.result;
                    imgPreview.src = event.target.result;
                    imgPreview.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        });

        // Menampilkan data menu secara otomatis & Real-time
        menuRef.on('value', (snapshot) => {
            const listContainer = document.getElementById('admin-menu-list');
            const data = snapshot.val();
            
            if (!data) {
                listContainer.innerHTML = '<p style="text-align:center; color:#999;">Belum ada menu di database.</p>';
                return;
            }

            let listHTML = '';
            for (let id in data) {
                const item = data[id];
                listHTML += `
                    <div class="admin-item">
                        <img src="${item.foto}" alt="${item.judul}">
                        <div class="admin-item-info">
                            <div class="admin-item-title">${item.judul}</div>
                            <div class="admin-item-price">Rp ${parseInt(item.harga).toLocaleString('id-ID')}</div>
                        </div>
                        <div class="admin-actions">
                            <button type="button" class="btn-action btn-edit" onclick="aksiEdit('${id}', '${item.judul}', '${item.harga}', '${item.foto}')">Edit</button>
                            <button type="button" class="btn-action btn-delete" onclick="aksiHapus('${id}')">Hapus</button>
                        </div>
                    </div>
                `;
            }
            listContainer.innerHTML = listHTML;
        }, (error) => {
            document.getElementById('admin-menu-list').innerHTML = `<p style="text-align:center; color:red;">Gagal koneksi Firebase! Periksa tab RULES database kamu.</p>`;
        });

        // Fungsi Global Hapus Menu
        window.aksiHapus = function(id) {
            if(confirm('Apakah Anda yakin ingin menghapus menu ini?')) {
                db.ref('menu/' + id).remove()
                .then(() => alert('Menu berhasil dihapus!'))
                .catch(err => alert('Gagal hapus: ' + err.message));
            }
        }

        // Fungsi Global Edit Menu
        window.aksiEdit = function(id, judul, harga, foto) {
            document.getElementById('menu-id').value = id;
            document.getElementById('menu-judul').value = judul;
            document.getElementById('menu-harga').value = harga;
            base64Input.value = foto;
            
            imgPreview.src = foto;
            imgPreview.style.display = 'block';

            document.getElementById('form-title').innerText = "Edit Menu Makanan";
            document.getElementById('btn-submit-text').innerText = "Simpan Perubahan";
            document.getElementById('btn-batal-edit').style.display = "block";
        }

        // Batal Edit
        document.getElementById('btn-batal-edit').addEventListener('click', resetFormAdmin);

        function resetFormAdmin() {
            document.getElementById('menu-form').reset();
            document.getElementById('menu-id').value = "";
            base64Input.value = "";
            imgPreview.style.display = 'none';
            document.getElementById('form-title').innerText = "Tambah Menu Baru";
            document.getElementById('btn-submit-text').innerText = "Simpan Menu ke Cloud";
            document.getElementById('btn-batal-edit').style.display = "none";
        }

        // Aksi Kirim Form (Simpan / Perbarui)
        document.getElementById('menu-form').addEventListener('submit', function(e) {
            e.preventDefault();

            const menuId = document.getElementById('menu-id').value;
            const foto = base64Input.value;
            const judul = document.getElementById('menu-judul').value;
            const harga = document.getElementById('menu-harga').value;

            if (!foto) {
                alert('Silakan pilih foto makanan terlebih dahulu dari galeri!');
                return;
            }

            if (menuId) {
                // Proses update
                db.ref('menu/' + menuId).update({ foto, judul, harga })
                .then(() => {
                    alert('Menu berhasil diperbarui!');
                    resetFormAdmin();
                }).catch(err => alert('Gagal update: ' + err.message));
            } else {
                // Proses tambah baru
                menuRef.push({ foto, judul, harga })
                .then(() => {
                    alert('Menu baru berhasil disimpan ke Firebase!');
                    resetFormAdmin();
                }).catch(err => alert('Gagal menyimpan: ' + err.message));
            }
        });
    </script>
</body>
</html>
